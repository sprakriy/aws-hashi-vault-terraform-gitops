apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-python-app
  labels:
    app: broken-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-app
  template:
    metadata:
      labels:
        app: broken-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: app
        image: python:3.11-slim
        command: ["python", "-c", "open('/test.txt', 'w').write('breaking security')"]
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
